name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  security-events: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-and-sonar:
    name: Test & SonarCloud
    runs-on: ubuntu-latest
    env:
      # Job-Ebene: nur dort ist das Secret im `if` der Steps sichtbar
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Sonar braucht die volle Historie
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Verify
        run: mvn -B verify
      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@b7b80d7ac5b1da46d6aaff9fb57ad50d8453bcb3 # v6.6.0
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          check_name: Tests
      # Ein SARIF je Zustand; jeder Lauf bekommt eine eigene Kategorie, sonst
      # weist Code Scanning mehrere SpotBugs-Laeufe in einem Upload ab.
      # Absolute Pfade (sarifFullPath) werden relativ zum Repo gemacht.
      - name: Collect SpotBugs SARIF
        if: always() && !github.event.repository.private && hashFiles('**/target/spotbugsSarif.json') != ''
        run: |
          mkdir -p sarif
          for f in Zustand_*/rentamovie/target/spotbugsSarif.json; do
            z=${f%%/*}
            jq --arg id "spotbugs/$z/" --arg ws "$GITHUB_WORKSPACE/" '
              .runs[].automationDetails = {id: $id}
              | walk(if type == "object" and (.uri? | type) == "string"
                     then .uri |= sub("^(file://)?" + $ws; "") else . end)
            ' "$f" > "sarif/$z.sarif"
          done
      - name: Upload SpotBugs SARIF
        if: always() && !github.event.repository.private && hashFiles('sarif/*.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif
      - name: SonarCloud
        # Secrets sind bei Fork-PRs nicht verfügbar
        if: env.SONAR_TOKEN != ''
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=michaelzett
          -Dsonar.projectKey=MichaelZett_rentamovie
          -Dsonar.projectName=rentamovie
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/target/surefire-reports/
            **/target/spotbugs*
          retention-days: 7
          compression-level: 9
          if-no-files-found: ignore
